<section class="page__share article-share" data-article-share data-share-url="{{ page.url | absolute_url | escape }}" data-share-title="{{ page.title | strip_html | escape }}">
  <h4 class="page__share-title">分享这篇文章</h4>
  <div class="article-share__actions">
    <button type="button" class="article-share__button" data-share-wechat>
      <i class="fab fa-weixin" aria-hidden="true"></i><span>微信</span>
    </button>
    <a class="article-share__button" href="https://connect.qq.com/widget/shareqq/index.html?url={{ page.url | absolute_url | url_encode }}&amp;title={{ page.title | strip_html | url_encode }}" target="_blank" rel="noopener noreferrer">
      <i class="fab fa-qq" aria-hidden="true"></i><span>QQ</span>
    </a>
    <button type="button" class="article-share__button" data-share-copy>
      <i class="fas fa-link" aria-hidden="true"></i><span>复制链接</span>
    </button>
  </div>
  <p class="article-share__status" data-share-status role="status" aria-live="polite"></p>
</section>
<script src="{{ '/assets/js/article-share.js' | relative_url }}" defer></script>
