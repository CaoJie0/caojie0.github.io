<section class="blog-support" data-blog-support aria-label="赞赏作者">
  <p class="blog-support__message">想要成为天使投资人吗<img class="blog-support__emoji" src="{{ '/images/support/wechat-wangchai.png' | relative_url }}" alt="[旺柴]" width="100" height="100"></p>
  <button class="blog-support__button" type="button" aria-expanded="false" aria-controls="blog-support-codes" data-support-toggle>赞赏</button>

  <div class="blog-support__codes" id="blog-support-codes" data-support-codes hidden>
    <figure class="blog-support__card blog-support__card--wechat">
      <figcaption>微信支付</figcaption>
      <div class="blog-support__qr blog-support__qr--wechat">
        <img src="{{ '/images/support/wechat.png' | relative_url }}" alt="曹杰的微信收款二维码" width="1308" height="1781" loading="lazy">
      </div>
      <p>微信扫码赞赏</p>
    </figure>
    <figure class="blog-support__card blog-support__card--alipay">
      <figcaption>支付宝</figcaption>
      <div class="blog-support__qr blog-support__qr--alipay">
        <img src="{{ '/images/support/alipay.png' | relative_url }}" alt="曹杰的支付宝收款二维码" width="1182" height="1772" loading="lazy">
      </div>
      <p>支付宝扫码赞赏</p>
    </figure>
  </div>

  {% unless include.hide_credit %}
    <div class="blog-support__credit">
      <p><strong>本文作者：</strong>{{ site.author.name | default: site.name | escape }}</p>
      <p><strong>本文链接：</strong><a href="{{ page.url | absolute_url }}">{{ page.url | absolute_url }}</a></p>
      <p><strong>版权声明：</strong>本文版权归作者所有，转载请注明出处。</p>
    </div>
  {% endunless %}
</section>
<script src="{{ '/assets/js/blog-support.js' | relative_url }}" defer></script>
